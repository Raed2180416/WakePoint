name: CI — analyze + never-late gate

# The never-late replay gate is the load-bearing CI check: it drives the REAL
# EkfOrchestrator + AlarmEvaluator + reachability over committed ride fixtures
# and FAILS (not skips) if any ride would fire late / never-fire / at the wrong
# place. It fails on empty fixtures, so a broken commit that drops the fixtures
# also fails. This is what stops the core never-late promise silently regressing.

on:
  push:
    branches: [sim-validation, stable-release-1, main]
  pull_request:
    branches: [sim-validation, stable-release-1, main]

jobs:
  analyze-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze lib/ (0 errors/warnings; infos non-fatal)
        run: flutter analyze lib/ --no-fatal-infos

      - name: NEVER-LATE replay gate (committed fixtures, fails on empty)
        run: flutter test test/ekf/replay_harness_test.dart

      - name: Reachability physics proofs
        run: flutter test test/reachability/

      - name: Never-late AT SCALE (real Dart over the committed route matrix)
        run: flutter test test/scale/reachability_scale_test.dart

      - name: NEVER-LATE through the simulation-playground engine (real replay)
        run: flutter test test/dashboard/playground_reachability_e2e_test.dart

      - name: Monotonic-clock guard (backward-wall-jump never-late)
        run: flutter test test/core/clock/

      - name: Metro data integrity (shipped Dart data)
        run: flutter test test/metro_data_integrity_test.dart test/metro_vehicle_types_test.dart

      - name: Full test suite (all pass)
        run: flutter test

  # ──────────────────────────────────────────────────
  # Security: secret scanning + SAST + invariant protection
  # ──────────────────────────────────────────────────
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep — SAST + invariant protection
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml

  # ──────────────────────────────────────────────────
  # geowake-server (Node/Express): Jest test suite gate.
  # Was previously written but never run in CI (ci-test-gates audit finding) —
  # this closes that gap, including coverage for the wallet-protection
  # cost-guards (server-cost-security finding).
  # ──────────────────────────────────────────────────
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: geowake-server
    env:
      # Fake, non-secret test values only — config.js hard-exits at require
      # time if these are missing (fires for Jest too). APP_BUNDLE_ID matches
      # what the pre-existing test suite already hardcodes.
      GOOGLE_MAPS_API_KEY: test-maps-key
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      APP_BUNDLE_ID: com.yourcompany.geowake2
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: geowake-server/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Jest test suite
        run: npx jest --silent
