name: geowake2
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  # For Flutter 3.7 or higher:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  

  path_provider: ^2.1.1
  audioplayers: ^6.4.0
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Alarm vibration (Android-first)
  vibration: ^3.1.4

  # Location tracking & distance calculation
  geolocator: ^14.0.0

  # UPDATED VERSIONS
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

  battery_plus: ^7.0.0
  logging: ^1.0.2
  connectivity_plus: ^7.0.0
  flutter_dotenv: ^6.0.0
  
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  permission_handler: ^12.0.0
  app_settings: ^6.1.1
  device_info_plus: ^12.1.0

  # Google Maps & Places
  google_maps_flutter: ^2.2.5
  google_places_flutter: ^2.0.0

  # Ads & In-app purchases
  google_mobile_ads: ^6.0.0
  in_app_purchase: ^3.2.1
  # Premium/paywall + share surfaces (Terms/Privacy links, last-mile deep-links,
  # viral journey share). Standard, widely-used, no native config beyond queries.
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  # Journey-share deep links (App Links) + opaque share ids.
  app_links: ^6.3.0
  uuid: ^4.5.1
  # Home-screen widget (Pro): next-commute glance + one-tap arm.
  home_widget: ^0.7.0

  cupertino_icons: ^1.0.8
  android_intent_plus: ^6.0.0
  package_info_plus: ^9.0.0

  # Fonts
  # Bumped from ^6.2.1: google_fonts 6.3.1 fails to compile on the installed
  # Flutter 3.44.6 / Dart 3.12 toolchain (const Map<FontWeight,String> now
  # rejected — FontWeight lacks primitive equality). 8.x fixes this; the
  # GoogleFonts.* API used by the app is unchanged.
  google_fonts: ^8.1.0

  # HTTP API calls
  http: ^1.4.0
  sensors_plus: ^7.0.0
  web_socket_channel: ^3.0.0
  crypto: ^3.0.3

  # Native bridge (partial wake lock + full-screen-intent capability check)
  wakepoint_native:
    path: packages/wakepoint_native
  # G5 backstop: schedule exact alarms at an absolute instant. Already a
  # transitive dep of flutter_local_notifications; pin it directly for the import.
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.3.5
  flutter_launcher_icons: ^0.14.3
  meta: ^1.12.0 # ADDED DEPENDENCY
  patrol: ^4.7.1

# Patrol (LeanCode) native E2E config. Consumed by `patrol test` / patrol_cli.
# app_name is a human label; the Android package under test is the RUNTIME
# applicationId (com.geowake.app), NOT the source namespace (com.example.geowake2).
patrol:
  app_name: GeoWake
  android:
    package_name: com.geowake.app

flutter:
  uses-material-design: true
  assets:
    - assets/geowake.png
    - assets/ringtones/
    - assets/osm/
    # Playground curated metro routes (~89KB): real Bengaluru Purple Line geometry
    # (curved polylines + station arc-lengths + timing) rebuilt from ride ground
    # truth. Small enough to bundle; the EKF test panel / replay engine needs it
    # so the metro routes (majestic/rajajinagar/nallur) load instead of throwing.
    - assets/ekf_test_routes/
    # NOTE: dev-only replay data (docs/Sandalsoap-whitefield/ ~274MB of raw IMU
    # CSVs + a 50MB unified log, and route_log_extracted.json) is NOT bundled —
    # it was inflating the APK ~285MB. Only the EKF test panel / replay engine
    # (developer diagnostics) referenced it; those load it at runtime from device
    # storage when present and degrade gracefully when absent.

flutter_native_splash:
  color: "#FFFFFF" # Match this with your custom splash background
  image: assets/geowake.png
  android_12:
    image: assets/geowake.png
    icon_background_color: "#FFFFFF"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/geowake.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/geowake.png"
