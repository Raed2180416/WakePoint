plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.geowake2"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.geowake.app"
        minSdkVersion 24
        targetSdkVersion 35
        // versionCode/versionName flow from pubspec `version: x.y.z+build` via the
        // Flutter Gradle plugin (flutter.versionCode / flutter.versionName).
        // BUGFIX (GAP: build): these were hardcoded to 1 / "1.0", so the pubspec
        // build number never reached Play and every upload after the first was
        // rejected as a duplicate versionCode — no wake-path fix could ever ship.
        // Bump the build number in pubspec (`+N`) to cut a new release.
        versionCode flutter.versionCode
        versionName flutter.versionName

        // Patrol (LeanCode) native E2E: run instrumentation through Patrol's
        // JUnit runner and clear app data between tests via the AndroidX Test
        // Orchestrator (configured under testOptions below).
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"

        // SECURITY: the Maps key comes ONLY from android/key.properties (gitignored).
        // The previous hardcoded fallback shipped a LIVE key in source control (and
        // it leaked into chat transcripts) — a billing/abuse risk and a Play flag.
        // An empty fallback fails loudly (maps blank) instead of shipping a secret.
        // ROTATE the exposed key AIzaSyC0v...XHw0 and put the new one in key.properties.
        manifestPlaceholders = [
            googleMapsApiKey: keystoreProperties['googleMapsApiKey'] ?: '',
            applicationName: 'io.flutter.app.FlutterApplication'
        ]
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // If you use R8 in release builds, ensure the proguard file is included:
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            // Fallback to the debug keystore when no production signing key is
            // configured in key.properties. This lets `flutter build apk --release`
            // produce an installable lean APK for testing without a release
            // keystore. When a real storeFile/storePassword/keyAlias/keyPassword
            // are present in key.properties, those take precedence.
            if (keystoreProperties['storeFile'] != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    signingConfigs {
        if (keystoreProperties['storeFile'] != null) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // Patrol (LeanCode) native E2E: run instrumentation under the AndroidX Test
    // Orchestrator so each test runs in its own instrumentation and app data is
    // cleared between tests (clearPackageData in defaultConfig).
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"

    // Desugaring support library
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Patrol (LeanCode) native E2E: AndroidX Test Orchestrator runtime. Required
    // for `testOptions { execution "ANDROIDX_TEST_ORCHESTRATOR" }` above —
    // installs the orchestrator APK so each Patrol test runs isolated and
    // clearPackageData works. (Version matches patrol 4.7.1's example.) The
    // JUnit + PatrolJUnitRunner deps come transitively from the patrol plugin.
    androidTestUtil 'androidx.test:orchestrator:1.5.1'
}
